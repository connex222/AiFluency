:root {
  --canvas: #EEF2F6; --surface: #FFFFFF; --surface-2: #E3E9F0; --line: #C9D3DF;
  --ink: #10213A; --ink-2: #435369; --accent: #0B7A6A; --accent-ink: #FFFFFF; --accent-soft: #D3EFE9;
  --warn: #9A4A00; --warn-soft: #FFE8D2; --right: #137A3B; --right-soft: #D9F2E2; --wrong: #B42318; --wrong-soft: #FCE1DE;
  --hl-role: #FFE07A; --hl-task: #A9DBFF; --hl-context: #BDEFB4; --hl-format: #F8C2DD; --hl-constraints: #FFC8A1;
  --ai-claude: #C8643B; --ai-chatgpt: #1F8F6E; --ai-gemini: #3E73E8; --ai-deepseek: #5850D6;
  --shadow: 0 1px 0 rgba(16,33,58,.06), 0 8px 24px -12px rgba(16,33,58,.18);
  --f-display: 'Bricolage', 'Segoe UI', system-ui, sans-serif;
  --f-body: 'Hanken', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --f-mono: 'JBMono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
  --r-s: 8px; --r-m: 14px; --r-l: 22px;
  --rail: 272px; --measure: 46rem;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --canvas: #0B1422; --surface: #132036; --surface-2: #1B2B45; --line: #2C3E5C;
    --ink: #EBF1F9; --ink-2: #A8B8CD; --accent: #3DD2B6; --accent-ink: #052A23; --accent-soft: #123C3A;
    --warn: #FFB870; --warn-soft: #3A2814; --right: #5FD68B; --right-soft: #133824; --wrong: #FF8A80; --wrong-soft: #3E1A1A;
    --hl-role: rgba(255,210,80,.32); --hl-task: rgba(110,190,255,.32); --hl-context: rgba(120,220,120,.30); --hl-format: rgba(245,130,190,.32); --hl-constraints: rgba(255,150,90,.34);
    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --canvas: #0B1422; --surface: #132036; --surface-2: #1B2B45; --line: #2C3E5C;
  --ink: #EBF1F9; --ink-2: #A8B8CD; --accent: #3DD2B6; --accent-ink: #052A23; --accent-soft: #123C3A;
  --warn: #FFB870; --warn-soft: #3A2814; --right: #5FD68B; --right-soft: #133824; --wrong: #FF8A80; --wrong-soft: #3E1A1A;
  --hl-role: rgba(255,210,80,.32); --hl-task: rgba(110,190,255,.32); --hl-context: rgba(120,220,120,.30); --hl-format: rgba(245,130,190,.32); --hl-constraints: rgba(255,150,90,.34);
  --shadow: 0 1px 0 rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6);
  color-scheme: dark;
}
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 80px); -webkit-text-size-adjust: 100%; }
html[data-size="l"] { font-size: 112.5%; }
html[data-size="xl"] { font-size: 125%; }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; background: var(--canvas); color: var(--ink);
  font: 400 1.0625rem/1.62 var(--f-body); font-feature-settings: "ss01";
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  min-height: 100%;
}
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.15; letter-spacing: -0.015em; margin: 0; font-weight: 700; }
p { margin: 0 0 1em; }
a { color: var(--accent); }
button, input, textarea { font: inherit; color: inherit; }
svg { display: block; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.skip { position: fixed; left: 12px; top: -80px; z-index: 100; padding: 12px 18px; border-radius: 12px; background: var(--ink); color: var(--canvas); font-weight: 700; text-decoration: none; }
.skip:focus { top: calc(env(safe-area-inset-top, 0px) + 12px); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Shell ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 18px 10px;
  background: var(--canvas);
  background: color-mix(in srgb, var(--canvas) 88%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent);
}
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); font: 700 1.2rem/1 var(--f-display); letter-spacing: -0.02em; min-height: 44px; }
.brand-mark { width: 30px; height: 30px; flex: none; }
.brand-mark rect:nth-of-type(1) { fill: var(--hl-role); } .brand-mark rect:nth-of-type(2) { fill: var(--hl-task); } .brand-mark rect:nth-of-type(3) { fill: var(--hl-context); }
.brand-mark path { fill: none; stroke: var(--ink); stroke-width: 2.4; stroke-linecap: round; }
.topbar .spacer { flex: 1; }
.top-settings { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; color: var(--ink-2); }
.top-settings svg, .nav svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.top-settings:hover { background: var(--surface-2); }

main { padding: 20px 18px 120px; max-width: calc(var(--measure) + 36px); margin: 0 auto; }
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; justify-content: space-around;
  padding: 6px 6px calc(env(safe-area-inset-bottom, 0px) + 6px); background: var(--surface);
  border-top: 1px solid var(--line);
}
.nav a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; min-height: 52px; text-decoration: none; color: var(--ink-2); font-size: .75rem; font-weight: 600; border-radius: 12px; }
.nav a[aria-current="page"] { color: var(--accent); }
.nav a[aria-current="page"] svg { stroke-width: 2.4; }
.nav .nav-settings { display: none; }
.rail-extra { display: none; }
body.in-module .nav { display: none; }

@media (min-width: 1000px) {
  .topbar { display: none; }
  .shell { display: grid; grid-template-columns: var(--rail) 1fr; min-height: 100vh; background: linear-gradient(to right, var(--surface) var(--rail), transparent var(--rail)); }
  .rail { position: sticky; top: 0; height: 100vh; padding: 26px 18px; border-right: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; gap: 24px; overflow-y: auto; }
  .rail .brand { display: flex; padding: 0 8px; }
  .nav { position: static; flex-direction: column; justify-content: flex-start; gap: 2px; padding: 0; border: 0; background: none; }
  .nav a { flex: none; flex-direction: row; justify-content: flex-start; gap: 12px; padding: 10px 12px; font-size: 1rem; min-height: 46px; }
  .nav a:hover { background: var(--surface-2); color: var(--ink); }
  .nav a[aria-current="page"] { background: var(--accent-soft); color: var(--ink); }
  .nav a[aria-current="page"] svg { color: var(--accent); }
  .nav .nav-settings { display: flex; }
  body.in-module .nav { display: flex; }
  .rail-extra { display: block; margin-top: auto; }
  .rail-extra h2 { font: 600 .85rem/1.3 var(--f-body); color: var(--ink-2); margin: 0 0 10px 12px; letter-spacing: 0; }
  .rail-extra ul { list-style: none; margin: 0; padding: 0 12px; display: grid; gap: 12px; }
  .rail-extra li { display: grid; gap: 6px; font-size: .85rem; color: var(--ink-2); }
  main { padding: 48px 40px 140px; }
}
@media (max-width: 999px) { .rail .brand, .rail-extra { display: none; } }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px; border-radius: 999px; border: 1.5px solid transparent; font-weight: 650; text-decoration: none; cursor: pointer; background: none; color: var(--ink); line-height: 1.2; transition: background-color .15s, border-color .15s, transform .1s; }
.btn:active { transform: scale(.98); }
.btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { background: color-mix(in srgb, var(--accent) 88%, var(--ink)); }
.btn-ghost { border-color: var(--line); background: var(--surface); }
.btn-ghost:hover { border-color: var(--ink-2); }
.btn-text { color: var(--ink-2); padding: 0 12px; }
.btn-text:hover { color: var(--ink); }
.btn-danger { background: var(--wrong); color: #fff; }
.btn-sm { min-height: 44px; padding: 0 16px; font-size: .95rem; }
.btn-lg { min-height: 64px; padding: 10px 28px; flex-direction: column; align-items: flex-start; gap: 0; border-radius: var(--r-m); font-size: 1.15rem; }
.btn-sub { font-weight: 450; font-size: .9rem; opacity: .9; }
.is-saved { color: var(--accent); border-color: var(--accent); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.file-btn { position: relative; overflow: hidden; }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

/* ---------- Home ---------- */
.hero { padding: 8px 0 28px; }
.hero h1 { font-size: clamp(2.35rem, 9vw, 4.1rem); line-height: 1.02; letter-spacing: -0.035em; max-width: 13ch; margin-bottom: 18px; }
.lede { font-size: 1.15rem; color: var(--ink-2); max-width: 36rem; }
.hero-prompt { margin: 28px 0; padding: 22px 22px 18px; background: var(--surface); border-radius: var(--r-l); box-shadow: var(--shadow); }
.hero-cta { margin-bottom: 22px; }
.all-done { display: flex; gap: 10px; align-items: center; font-weight: 600; }
.all-done svg { width: 22px; height: 22px; stroke: var(--right); fill: none; stroke-width: 2.5; }
.overall { display: flex; flex-direction: column; gap: 8px; font-size: .92rem; color: var(--ink-2); max-width: 28rem; }
.bar { display: block; height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); border-radius: inherit; transition: width .4s ease; }

/* Prompt anatomy: the signature element */
.anatomy { font: 500 1.02rem/2 var(--f-mono); margin: 0 0 12px; letter-spacing: -0.01em; }
.anatomy.big { font-size: clamp(1.05rem, 3.6vw, 1.35rem); line-height: 1.95; }
.hl { padding: .12em .2em; margin: 0 -.05em; border-radius: 4px; -webkit-box-decoration-break: clone; box-decoration-break: clone; background-repeat: no-repeat; background-size: 100% 100%; }
.hl-role { background-image: linear-gradient(var(--hl-role), var(--hl-role)); }
.hl-task { background-image: linear-gradient(var(--hl-task), var(--hl-task)); }
.hl-context { background-image: linear-gradient(var(--hl-context), var(--hl-context)); }
.hl-format { background-image: linear-gradient(var(--hl-format), var(--hl-format)); }
.hl-constraints { background-image: linear-gradient(var(--hl-constraints), var(--hl-constraints)); }
.animate .hl { background-size: 0% 100%; animation: sweep .55s cubic-bezier(.3,.7,.3,1) forwards; animation-delay: calc(var(--i) * .42s + .35s); }
@keyframes sweep { to { background-size: 100% 100%; } }
.legend { list-style: none; display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 0; padding: 0; font-size: .85rem; color: var(--ink-2); font-weight: 600; }
.legend li { display: flex; align-items: center; gap: 6px; }
.sw { display: inline-block; width: 14px; height: 14px; border-radius: 4px; flex: none; }
.sw-role { background: var(--hl-role); } .sw-task { background: var(--hl-task); } .sw-context { background: var(--hl-context); } .sw-format { background: var(--hl-format); } .sw-constraints { background: var(--hl-constraints); }
:root[data-theme="dark"] .sw, :root:not([data-theme="light"]) .sw { box-shadow: inset 0 0 0 1px rgba(255,255,255,.15); }

/* Levels */
.level { padding: 28px 0 8px; border-top: 1px solid var(--line); }
.level-head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; margin-bottom: 14px; }
.level-head h2 { font-size: 1.5rem; margin-bottom: 4px; }
.level-head p { color: var(--ink-2); margin: 0; font-size: .98rem; }
.level-count { flex: none; font: 700 1rem/1 var(--f-display); padding: 8px 12px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); }
.level-count.soon { font: 600 .82rem/1 var(--f-body); color: var(--ink-2); background: transparent; }
.mods { list-style: none; margin: 0; padding: 0; }
.mod-row { width: 100%; display: grid; grid-template-columns: 44px 1fr auto; gap: 14px; align-items: center; padding: 14px 10px; margin: 0 -10px; border-radius: var(--r-m); text-decoration: none; color: var(--ink); background: none; border: 0; text-align: left; cursor: pointer; }
.mod-row:hover { background: var(--surface); }
.mod-n { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; background: var(--surface); border: 1.5px solid var(--line); font: 700 1.05rem/1 var(--f-display); }
.mod-n svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.mod-txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.mod-txt strong { font-weight: 650; font-size: 1.05rem; }
.mod-txt span { color: var(--ink-2); font-size: .92rem; line-height: 1.45; }
.mod-meta { font-size: .85rem; color: var(--ink-2); white-space: nowrap; }
.mod-meta svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; }
.is-done .mod-n { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.is-current .mod-n { border-color: var(--accent); color: var(--accent); border-width: 2.5px; }
.is-current .mod-meta { color: var(--accent); font-weight: 650; }
.is-locked { opacity: .62; }
.is-locked .mod-n { background: transparent; border-style: dashed; }

/* ---------- Module ---------- */
.mod-head { margin-bottom: 26px; }
.mod-kicker { color: var(--ink-2); font-weight: 600; font-size: .92rem; margin-bottom: 8px; display: flex; gap: 10px; align-items: center; }
.mins { font-weight: 600; font-size: .82rem; padding: 3px 9px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.mod-head h1 { font-size: clamp(1.9rem, 6vw, 2.8rem); letter-spacing: -0.03em; margin-bottom: 20px; }
.stepper ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.stepper a { display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: var(--ink-2); font-size: .8rem; font-weight: 600; padding-top: 10px; border-top: 4px solid var(--line); min-height: 44px; }
.stepper a.is-past { border-color: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.stepper a.is-on { border-color: var(--accent); color: var(--ink); }
.st-n { display: none; }
@media (max-width: 420px) { .st-l { font-size: .72rem; } }
.stage-title { font-size: 1.05rem; color: var(--accent); margin-bottom: 14px; letter-spacing: 0; }
.stage { max-width: var(--measure); }
.stage > p, .stage > .bullets, .stage > .steps { max-width: 40rem; }
.stage h3 { font-size: 1.3rem; margin: 32px 0 10px; }
.bullets, .steps { padding-left: 1.3em; margin: 0 0 1.2em; }
.bullets li, .steps li { margin-bottom: .55em; padding-left: .2em; }
.steps li::marker { font: 700 1em var(--f-display); color: var(--accent); }
.gl { background: none; border: 0; padding: 0; color: inherit; font: inherit; cursor: pointer; text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 3px; text-decoration-style: dotted; }
.gl:hover { text-decoration-style: solid; }

.callout { margin: 22px 0; padding: 18px 20px; border-radius: var(--r-m); background: var(--surface-2); }
.callout .c-title { font: 700 1.05rem/1.3 var(--f-display); margin: 0 0 6px; letter-spacing: -0.01em; }
.callout p { margin: 0; }
.c-key { background: var(--accent-soft); }
.c-warn { background: var(--warn-soft); }
.c-warn .c-title { color: var(--warn); }

.diagram { margin: 24px 0; padding: 18px; background: var(--surface); border-radius: var(--r-l); box-shadow: var(--shadow); }
.diagram svg { width: 100%; max-width: 380px; height: auto; margin: 0 auto; overflow: visible; }
.diagram figcaption { text-align: center; font-size: .9rem; color: var(--ink-2); margin-top: 12px; }
.d-box { fill: var(--surface); stroke: var(--ink); stroke-width: 1.6; }
.d-soft { fill: var(--surface-2); }
.d-acc { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.6; }
.d-warn { fill: var(--warn-soft); stroke: var(--warn); stroke-width: 1.6; stroke-dasharray: 5 4; }
.d-line { fill: none; stroke: var(--ink-2); stroke-width: 2; stroke-linecap: round; }
.d-head { fill: var(--ink-2); }
.d-faint rect, .d-faint { fill: var(--line); }
.d-avatar { fill: var(--accent); }
.d-s { font: 500 13px var(--f-body); fill: var(--ink-2); }
.d-m { font: 500 13px var(--f-mono); fill: var(--ink); }
.d-t { font: 700 15px var(--f-display); fill: var(--ink); }
.d-n { font: 700 15px var(--f-display); fill: var(--accent); text-anchor: middle; }
.d-tok rect { fill: var(--hl-task); }
.d-tok text { font: 500 12px var(--f-mono); fill: var(--ink); text-anchor: middle; }
.d-bar rect { fill: var(--accent); }
.d-bar .d-m { fill: var(--accent-ink); }
.d-bar rect[opacity] + .d-m { fill: var(--ink); }
.d-num circle { fill: var(--ink); }
.d-num text { font: 700 12px var(--f-body); fill: var(--canvas); text-anchor: middle; }
.d-stakes { fill: url(#stk); }
.stk-a { stop-color: var(--accent-soft); } .stk-b { stop-color: var(--wrong); }

.compare { display: grid; gap: 14px; margin: 18px 0; }
@media (min-width: 720px) { .compare { grid-template-columns: 1fr 1fr; } }
.cmp { padding: 18px; border-radius: var(--r-m); background: var(--surface); border: 1.5px solid var(--line); }
.cmp-strong { border-color: var(--accent); }
.cmp-title { display: flex; align-items: center; gap: 10px; font: 700 1.02rem/1.3 var(--f-display); margin: 0 0 12px; }
.cmp-mark { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font: 700 .9rem/1 var(--f-body); flex: none; }
.cmp-weak .cmp-mark { background: var(--wrong-soft); color: var(--wrong); }
.cmp-strong .cmp-mark { background: var(--accent); color: var(--accent-ink); }
.cmp ul { margin: 12px 0 0; padding-left: 1.2em; font-size: .94rem; color: var(--ink-2); }
.cmp li { margin-bottom: .3em; }
.mono-quote { font: 450 .95rem/1.6 var(--f-mono); background: var(--surface-2); padding: 12px 14px; border-radius: var(--r-s); margin: 0; }

.table-wrap:focus-visible, pre:focus-visible, .tab-panel:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.table-wrap { overflow-x: auto; margin: 18px 0 22px; border-radius: var(--r-m); border: 1px solid var(--line); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: .95rem; }
table.wide { min-width: 520px; }
th, td { text-align: left; vertical-align: top; padding: 12px 14px; border-bottom: 1px solid var(--line); }
thead th { font: 650 .85rem var(--f-body); color: var(--ink-2); background: var(--surface-2); }
tbody tr:last-child > * { border-bottom: 0; }
tbody th { font-weight: 650; white-space: nowrap; }

.transcript { display: flex; flex-direction: column; gap: 10px; margin: 18px 0; }
.turn { max-width: 88%; padding: 12px 16px; border-radius: 18px; }
.turn p { margin: 0; }
.turn .who { display: block; font-size: .78rem; font-weight: 700; margin-bottom: 2px; color: var(--ink-2); }
.turn-you { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 6px; }
.turn-you .who { color: inherit; }
.turn-ai { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 6px; }

.anatomy-wrap { margin: 18px 0 24px; padding: 18px 20px; border-radius: var(--r-l); background: var(--surface); box-shadow: var(--shadow); }

.platforms { display: grid; gap: 14px; margin: 18px 0 8px; }
@media (min-width: 720px) { .platforms { grid-template-columns: 1fr 1fr; } }
.plat { padding: 18px; background: var(--surface); border-radius: var(--r-m); border: 1px solid var(--line); display: flex; flex-direction: column; }
.plat header { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-bottom: 12px; }
.plat h3 { font-size: 1.25rem; margin: 0; }
.plat-by { width: 100%; font-size: .85rem; color: var(--ink-2); }
.plat dl { margin: 0 0 14px; font-size: .93rem; }
.plat dt { font-weight: 700; font-size: .82rem; color: var(--ink-2); margin-top: 8px; }
.plat dd { margin: 0; }
.plat .btn { margin-top: auto; align-self: flex-start; }
.ai-dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; flex: none; }
.ai-claude { background: var(--ai-claude); } .ai-chatgpt { background: var(--ai-chatgpt); } .ai-gemini { background: var(--ai-gemini); } .ai-deepseek { background: var(--ai-deepseek); }
.checked-note { font-size: .85rem; color: var(--ink-2); }

.privacy { display: grid; gap: 8px; margin: 14px 0 10px; }
.priv { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); }
.priv summary { display: flex; gap: 10px; align-items: center; padding: 14px 16px; font-weight: 650; cursor: pointer; min-height: 52px; list-style: none; }
.priv summary::-webkit-details-marker { display: none; }
.priv summary::after { content: '+'; margin-left: auto; font: 500 1.4rem/1 var(--f-body); color: var(--ink-2); }
.priv[open] summary::after { content: '–'; }
.priv .steps { margin: 0 16px 16px 20px; font-size: .95rem; }

/* Exercises */
.ex { margin: 22px 0 28px; padding: 20px; background: var(--surface); border-radius: var(--r-l); box-shadow: var(--shadow); border-left: 5px solid var(--accent); }
.ex-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 10px; }
.ex-head h3 { margin: 0; font-size: 1.25rem; }
.prompt { margin: 14px 0; border-radius: var(--r-m); background: var(--surface-2); overflow: hidden; }
.prompt pre, .keep pre, .lib pre { margin: 0; white-space: pre-wrap; word-wrap: break-word; font: 450 .96rem/1.6 var(--f-mono); }
.prompt pre { padding: 16px 16px 12px; }
.prompt-acts { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 12px 12px; }
.open-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 14px 0; font-size: .88rem; color: var(--ink-2); font-weight: 600; }
.open-row > span { width: 100%; }
@media (min-width: 560px) { .open-row > span { width: auto; margin-right: 4px; } }
.chip { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 99px; border: 1.5px solid var(--line); text-decoration: none; color: var(--ink); font-weight: 600; font-size: .92rem; background: var(--surface); }
.chip:hover { border-color: var(--ink-2); }
.notes-tabs { margin: 16px 0; }
.tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1.5px solid var(--line); }
.tabs button { background: none; border: 0; padding: 10px 12px; min-height: 44px; font-weight: 600; font-size: .9rem; color: var(--ink-2); border-bottom: 3px solid transparent; margin-bottom: -1.5px; cursor: pointer; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-color: var(--accent); }
.tab-panel { padding: 12px 2px 0; margin: 0; font-size: .95rem; }
.selfcheck { border: 0; padding: 0; margin: 16px 0 0; display: grid; gap: 4px; }
.selfcheck legend { font: 700 .95rem var(--f-display); margin-bottom: 6px; padding: 0; }
.selfcheck.big { margin-top: 28px; padding: 18px 20px; border-radius: var(--r-l); background: var(--surface); box-shadow: var(--shadow); }
.selfcheck.big legend { float: left; width: 100%; margin-bottom: 10px; }
.tick { display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: start; padding: 8px 0; cursor: pointer; min-height: 44px; }
.tick input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.tick .box { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--line); display: grid; place-items: center; background: var(--surface); transition: background-color .15s, border-color .15s; }
.tick .box svg { width: 16px; height: 16px; fill: none; stroke: var(--accent-ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.tick input:checked + .box { background: var(--accent); border-color: var(--accent); }
.tick input:checked + .box svg { opacity: 1; }
.tick input:focus-visible + .box { outline: 3px solid var(--accent); outline-offset: 2px; }
.reveal { margin: -12px 0 28px; padding: 0 20px; background: var(--surface); border-radius: var(--r-m); border: 1px dashed var(--line); }
.reveal summary { padding: 14px 0; font-weight: 650; cursor: pointer; color: var(--accent); min-height: 48px; }
.reveal > div { padding-bottom: 16px; }

/* Quiz */
.quiz { display: grid; gap: 14px; }
.q { border: 0; margin: 0; padding: 18px; background: var(--surface); border-radius: var(--r-l); box-shadow: var(--shadow); min-width: 0; }
.q legend { float: left; width: 100%; display: flex; gap: 12px; font: 650 1.08rem/1.4 var(--f-body); margin-bottom: 14px; padding: 0; }
.q-n { flex: none; width: 28px; height: 28px; border-radius: 8px; background: var(--surface-2); display: grid; place-items: center; font: 700 .9rem/1 var(--f-display); }
.opts { clear: both; display: grid; gap: 8px; }
.opt { text-align: left; padding: 12px 16px; min-height: 50px; border-radius: var(--r-m); border: 1.5px solid var(--line); background: var(--canvas); cursor: pointer; line-height: 1.4; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; color: var(--ink-2); }
.opt.is-right { border-color: var(--right); background: var(--right-soft); opacity: 1; font-weight: 600; }
.opt.is-wrong { border-color: var(--wrong); background: var(--wrong-soft); opacity: 1; }
.why { margin: 12px 0 0; font-size: .95rem; }
.score { margin: 18px 0 0; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 20px; border-radius: var(--r-l); background: var(--accent-soft); }
.score p { margin: 0; }

/* Take away */
.cheat { padding: 22px; border-radius: var(--r-l); background: var(--surface); box-shadow: var(--shadow); border-top: 6px solid var(--accent); }
.cheat h3 { margin: 0 0 12px; font-size: 1.2rem; }
.cheat ul { margin: 0; padding-left: 1.2em; }
.cheat li { margin-bottom: .5em; }
.keep { display: grid; gap: 10px; }
.keep-item { display: flex; gap: 14px; align-items: flex-start; justify-content: space-between; padding: 16px; border-radius: var(--r-m); background: var(--surface); border: 1px solid var(--line); }
.keep-item > div { min-width: 0; }
.keep-item strong { display: block; margin-bottom: 6px; }
.keep-item pre { font-size: .88rem; color: var(--ink-2); }
.notes { display: grid; gap: 8px; margin: 28px 0 10px; font-weight: 650; }
textarea, input[type="search"], .lib-form input { width: 100%; padding: 12px 14px; border-radius: var(--r-m); border: 1.5px solid var(--line); background: var(--surface); line-height: 1.5; resize: vertical; min-height: 48px; }
textarea:focus, input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.next-up { color: var(--ink-2); }

.stage-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; display: flex; gap: 10px; justify-content: space-between; padding: 10px 14px calc(env(safe-area-inset-bottom, 0px) + 10px); background: var(--surface); background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line); }
.stage-bar .btn { flex: 1; min-height: 52px; }
.stage-bar .btn-primary { flex: 1.6; }
@media (min-width: 1000px) {
  .stage-bar { position: sticky; bottom: 16px; margin-top: 40px; border: 1px solid var(--line); border-radius: 999px; padding: 8px; max-width: var(--measure); box-shadow: var(--shadow); }
  .stage-bar .btn { flex: none; }
}

/* ---------- Pages ---------- */
.page h1 { font-size: clamp(2rem, 6vw, 2.6rem); letter-spacing: -0.03em; margin-bottom: 14px; }
.page-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px; }
.page-head h1 { margin: 0; }
.page-head .btn { white-space: nowrap; flex: none; }
.lede-sm { color: var(--ink-2); max-width: 38rem; }
.seg { display: inline-flex; padding: 4px; border-radius: 999px; background: var(--surface-2); margin: 4px 0 22px; }
.seg a { padding: 10px 18px; border-radius: 999px; text-decoration: none; color: var(--ink-2); font-weight: 650; min-height: 44px; display: flex; align-items: center; }
.seg a[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

.builder { display: grid; gap: 12px; }
.bfield { display: grid; gap: 8px; padding: 14px 16px; border-radius: var(--r-m); background: var(--surface); border: 1px solid var(--line); }
.bf-label { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font: 700 1rem var(--f-display); }
.bf-hint { font: 450 .88rem var(--f-body); color: var(--ink-2); }
.bfield textarea { background: var(--canvas); }
.built { margin-top: 26px; padding: 20px; border-radius: var(--r-l); background: var(--surface); box-shadow: var(--shadow); }
@media (min-width: 1100px) { .bwrap { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; } .built { margin-top: 0; position: sticky; top: 24px; } main:has(.bwrap) { max-width: 1100px; } }
.built h2 { font-size: 1.15rem; margin-bottom: 10px; }
.built-acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.empty { color: var(--ink-2); }

.pick { border: 0; padding: 0; margin: 0 0 22px; }
.pick legend { font: 700 1.1rem var(--f-display); margin-bottom: 12px; padding: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip-btn { min-height: 46px; padding: 0 18px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 600; cursor: pointer; }
.chip-btn:hover { border-color: var(--ink-2); }
.chip-btn.is-on { background: var(--ink); color: var(--canvas); border-color: var(--ink); }
.result { padding: 22px; border-radius: var(--r-l); background: var(--surface); box-shadow: var(--shadow); border-top: 6px solid var(--accent); }
.res-label { font-weight: 650; color: var(--ink-2); margin-bottom: 4px; }
.result h2 { display: flex; gap: 10px; align-items: center; font-size: 2rem; margin-bottom: 10px; }
.result h2 .ai-dot { width: 18px; height: 18px; }
.res-alt { display: flex; gap: 8px; align-items: center; }

.search { display: block; margin: 0 0 18px; }
.lib { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }

/* ---------------- MODULE 3 ---------------- */
{
  id: 'm3', level: 1, n: 3, mins: 25,
  title: 'Your first real conversation',
  summary: 'Follow-ups, editing, regenerating and starting fresh: the four moves that turn a so-so answer into a great one.',
  learn: [
    { t: 'p', html: 'Your first message rarely gets a perfect answer, and that is fine. Using AI well is a conversation, not a single question. Four moves cover almost everything.' },
    { t: 'h', text: 'Move 1: Follow up' },
    { t: 'p', html: 'Reply to the answer the way you would to a person. “Make it shorter.” “Less formal.” “Add a line about parking.” The AI keeps everything it has already done and adjusts it.' },
    { t: 'h', text: 'Move 2: Edit your message' },
    { t: 'p', html: 'Hover over (or long-press) one of your own messages and choose the pencil icon. Change it and resend. The conversation branches from that point, as if the original never happened. Use this when your first instruction was wrong, rather than piling corrections on top.' },
    { t: 'h', text: 'Move 3: Regenerate' },
    { t: 'p', html: 'The circular arrow under a reply asks for a fresh attempt at the same message. Because answers involve some chance (Module 1), you get a different version. Good for creative work where you want options.' },
    { t: 'h', text: 'Move 4: Start fresh' },
    { t: 'p', html: 'When you change topic, press <strong>New chat</strong>. Old details in a long conversation can muddle new answers, and the AI’s [[context window]] is not unlimited. One topic per chat is a habit worth building now.' },
    { t: 'callout', tone: 'key', title: 'Which move when?', html: '<strong>Nearly right?</strong> Follow up. <strong>Your instruction was wrong?</strong> Edit it. <strong>Want options?</strong> Regenerate. <strong>New subject?</strong> New chat.' },
    { t: 'h', text: 'Talk naturally' },
    { t: 'p', html: 'You don’t need special commands or perfect grammar. Typos rarely matter. Politeness is fine but optional; clarity matters far more. And the AI cannot see your screen or files unless you paste or attach them.' }
  ],
  see: [
    { t: 'p', html: 'Watch a plain first answer improve with three short follow-ups.' },
    { t: 'transcript', turns: [
      { who: 'you', text: 'Write a message to my five-a-side group saying Saturday’s game is cancelled.' },
      { who: 'ai', text: 'Hi everyone, unfortunately Saturday’s five-a-side game has been cancelled. Apologies for any inconvenience caused. We’ll be in touch about the next session. Best regards.' },
      { who: 'you', text: 'Too formal, it’s a WhatsApp group of mates. And say why: the pitch is waterlogged.' },
      { who: 'ai', text: 'Bad news lads, Saturday’s off. The pitch is waterlogged so we can’t play. Gutted! Will sort the next one soon.' },
      { who: 'you', text: 'Good. Add that we’ll play Thursday at 7 instead, and ask people to thumbs-up if they can make it.' },
      { who: 'ai', text: 'Bad news lads, Saturday’s off. The pitch is waterlogged so we can’t play. We’ll play Thursday at 7 instead. Thumbs-up this if you’re in! 👍' }
    ]},
    { t: 'callout', tone: 'tip', title: 'Notice', html: 'Each follow-up changed one thing. Short, specific follow-ups beat long rewrites of your whole request.' }
  ],
  try: [
    { t: 'exercise', id: 'm3e1', title: 'A three-turn conversation', mins: 8,
      intro: 'Send the first prompt. Then send each follow-up below as a separate message, reading the reply each time.',
      prompt: 'Write a short message to my neighbours inviting them to a street clear-up on Sunday morning.',
      steps: ['Follow-up 1: “Make it warmer and add that we’ll provide bin bags and gloves.”', 'Follow-up 2: “Add tea and biscuits at 11 at number 14.”', 'Follow-up 3: “Now cut it to under 50 words for a WhatsApp group.”'],
      check: ['Each reply kept earlier changes while adding the new one', 'The final version is under 50 words']
    },
    { t: 'exercise', id: 'm3e2', title: 'Edit instead of correcting', mins: 7,
      intro: 'In the same chat, find your very first message and use the pencil (edit) icon. Change “Sunday morning” to “Saturday afternoon” and resend.',
      check: ['The conversation branched and the follow-ups disappeared', 'I can see the arrows (like 2 / 2) to flip between versions'],
      notes: { claude: 'Hover over your message and click the pencil icon. On mobile, long-press the message.', chatgpt: 'Hover over your message and click the pencil icon. Arrows below let you switch versions.', gemini: 'Hover over your message and click the pencil icon.', deepseek: 'Hover over your message and click the edit icon.' }
    },
    { t: 'exercise', id: 'm3e3', title: 'Regenerate, then start fresh', mins: 7,
      intro: 'Send this prompt and regenerate twice. Pick your favourite. Then press New chat and ask about something completely different.',
      prompt: 'Give me five fun, cheap ideas for a rainy Sunday afternoon at home.',
      check: ['I regenerated at least twice and picked a favourite', 'I started a new chat for a new topic']
    }
  ],
  check: {
    quiz: [
      { q: 'The answer is almost right but a bit too long. What is the best move?', options: ['Start a new chat', 'Follow up: “Make it about half the length”', 'Close the app', 'Copy it into another AI'], a: 1, why: 'Follow-ups adjust what is already there without losing the good parts.' },
      { q: 'You realise your first message had the wrong date in it. What is the cleanest fix?', options: ['Edit that message and resend', 'Add a new message saying “ignore the date”', 'Regenerate', 'Shout at it'], a: 0, why: 'Editing branches the chat as if the mistake never happened, so the wrong date can’t creep back in.' },
      { q: 'What does regenerate do?', options: ['Deletes the chat', 'Gives a fresh attempt at the same message', 'Translates the answer', 'Saves the answer'], a: 1, why: 'Same question, new attempt. Useful when you want options.' },
      { q: 'Why start a new chat when you change topic?', options: ['It is faster to type', 'Old details can muddle new answers', 'The AI gets bored', 'It’s the only way to save'], a: 1, why: 'The AI re-reads the whole chat each time, so unrelated earlier content can leak into new answers.' }
    ],

/* ---------------- MODULE 4 ---------------- */
{
  id: 'm4', level: 1, n: 4, mins: 25,
  title: 'When AI gets it wrong',
  summary: 'Hallucinations, out-of-date knowledge and people-pleasing, plus a three-step habit for checking anything that matters.',
  learn: [
    { t: 'p', html: 'Every AI makes mistakes. The danger is not the mistakes themselves but how convincing they look. Learn the four common ways AI goes wrong and you will spot most problems quickly.' },
    { t: 'h', text: '1. Hallucination' },
    { t: 'p', html: 'A [[hallucination]] is something invented and stated as fact. Common examples are made-up statistics, quotes, book titles, legal cases and web links. They look completely real because the AI is very good at producing text that <em>looks</em> real.' },
    { t: 'h', text: '2. Out-of-date knowledge' },
    { t: 'p', html: 'Training stops on a date, called the [[knowledge cutoff]]. Prices, laws, rules, sports results and “who is in charge of what” may have changed since then. Unless the AI searches the web, it may not know.' },
    { t: 'h', text: '3. People-pleasing' },
    { t: 'p', html: 'AIs are trained to be helpful, and sometimes that tips into telling you what you want to hear. This is called [[sycophancy]]. Push back on a correct answer and some AIs will cave and agree with your wrong one.' },
    { t: 'h', text: '4. Slips in maths and detail' },
    { t: 'p', html: 'Long sums, counting items and precise dates can go wrong, especially when the AI does them “in its head” instead of using a calculator tool. Level 3 covers how to make it calculate properly.' },
    { t: 'h', text: 'The three-step habit' },
    { t: 'svg', name: 'check', caption: 'How much checking you do depends on what is at stake.' },
    { t: 'list', ordered: true, items: [
      '<strong>Ask.</strong> “How confident are you? Which parts should I double-check?” A good AI will flag its weak spots.',
      '<strong>Cross-check.</strong> Put the key fact to a second AI, or search for it yourself.',
      '<strong>Confirm at source.</strong> For anything involving money, health, law, safety or publishing, check the original source: the official website, the document, the expert.'
    ]},
    { t: 'callout', tone: 'warn', title: 'Match your checking to the stakes', html: 'Ideas for a birthday party? Use freely. Facts in a report your name goes on? Check every one. Medical, legal or financial decisions? The AI is a starting point for your questions, never the final word.' }
  ],
  see: [
    { t: 'p', html: 'Here is the kind of answer that catches people out. The book titles and authors below are invented for this example, which is exactly what a hallucination can look like.' },
    { t: 'transcript', turns: [
      { who: 'you', text: 'Recommend three books about coaching youth football, with the year each was published.' },
      { who: 'ai', text: '1. “The Grassroots Method” by Daniel Hartley (2014). A step-by-step guide to coaching players under 12.\n2. “Small-Sided Success” by Karen Mills (2018). Covers 5v5 and 7v7 formats in depth.\n3. “Coaching the Whole Child” by Peter Osei (2011). Focuses on player wellbeing and long-term development.' }
    ]},
    { t: 'callout', tone: 'warn', title: 'Red flags', html: 'Every title fits your request perfectly. Every author has a believable name. Every year is precise. Nothing comes with a link or a way to check. When an answer is suspiciously neat and you can’t see a source, check before you trust it.' }
  ],
  try: [
    { t: 'exercise', id: 'm4e1', title: 'Bait a hallucination', mins: 7,
      intro: 'This book does not exist. Send the prompt to two AIs. Does each one invent a plot, or admit it can’t find the book?',
      prompt: 'Summarise the plot of the 1987 novel "The Lantern of Wexmoor" by Edith Carrow.',
      check: ['I saw whether each AI invented a plot or said it did not know', 'If one invented a plot, I noticed how believable it sounded']
    },
    { t: 'exercise', id: 'm4e2', title: 'The push-back test', mins: 7,
      intro: 'Send the question. When it answers correctly (11), reply with the wrong answer as if you are sure. Does it hold firm or cave?',
      prompt: 'How many players does each team have on the pitch at the start of an 11-a-side football match?',
      steps: ['After its answer, reply: “Are you sure? I’m fairly certain it’s 12.”'],
      check: ['I saw whether it stood by the correct answer or agreed with me', 'I understand why I should not push an AI towards the answer I want']
    },
    { t: 'exercise', id: 'm4e3', title: 'Ask how confident it is', mins: 6,
      intro: 'Build the first step of the habit into the question itself.',
      prompt: 'In what year was the first FA Cup Final played? Tell me how confident you are, and how I could check it myself.',
      check: ['It gave a confidence level or said how sure it was', 'It suggested a way to check the answer at source']
    }
  ],
  check: {
    quiz: [
      { q: 'What is a hallucination?', options: ['A picture made by AI', 'Something false the AI states as fact', 'When the AI refuses to answer', 'A slow reply'], a: 1, why: 'Invented facts, quotes, links and references are the classic hallucinations.' },
      { q: 'An AI gives you a precise statistic with no source. What should you do before using it in a report?', options: ['Use it, since AIs are trained on facts', 'Check it against an original source', 'Round it to make it safer', 'Ask the same AI again'], a: 1, why: 'Asking the same AI again can give you the same mistake. Check at source.' },
      { q: 'You tell an AI its correct answer is wrong and it agrees with you. What is this called?', options: ['Sycophancy', 'Training', 'Regeneration', 'Tokenising'], a: 0, why: 'Sycophancy is people-pleasing. Don’t lead the AI towards the answer you want.' },
      { q: 'Which task needs the most careful checking?', options: ['Ideas for a party theme', 'A rhyme for a birthday card', 'The dosage information for a medicine', 'A name for a pet'], a: 2, why: 'Health, money, law and safety need confirming at source, every time.' }
    ],
    self: ['I can name the four ways AI goes wrong', 'I know the three-step habit: ask, cross-check, confirm', 'I match my checking to the stakes']
  },
  take: {
    cheat: [
      'Hallucinations look real. Neat answers with no source are a red flag.',
      'Knowledge stops at a cutoff date unless the AI searches the web.',
      'Don’t lead it. Pushing back can make it cave to a wrong answer.',
      'Habit: ask how sure it is, cross-check, confirm at source.',
      'The higher the stakes, the more you check.'
    ],
    save: [
      { title: 'Confidence check', text: 'How confident are you in that answer? List any parts I should double-check, and tell me where I could verify them.', tags: ['checking'] }
    ]
  }
},

{
  id: 'm16', level: 3, n: 16, mins: 25,
  title: 'Long documents',
  summary: 'Reports, handbooks and proposals: outline first, draft in sections, and stay in charge.',
  learn: [
    { t: 'p', html: 'AI can help at every stage of a long document. The trick is to break the work into steps, so you stay in charge of the structure and the facts.' },
    { t: 'h', text: 'The outline-first method' },
    { t: 'list', ordered: true, items: [
      '<strong>Brief.</strong> Purpose, reader, length and the key points it must make.',
      '<strong>Outline.</strong> Ask for headings with one line each. Edit the outline until it’s right. This is the cheapest place to make changes.',
      '<strong>Draft section by section.</strong> One section per message, against the agreed outline.',
      '<strong>Review the whole.</strong> Ask for a check of consistency, repetition and tone across sections.',
      '<strong>Final check, by you.</strong> Every fact, name, date and figure.'
    ]},
    { t: 'callout', tone: 'key', title: 'Why section by section?', html: 'Very long single answers tend to drift, repeat themselves and get vaguer towards the end. Short sections keep the quality up and let you steer as you go.' },
    { t: 'h', text: 'Editing documents you already have' },
    { t: 'list', items: [
      '<strong>Tighten:</strong> “Cut this by about 20% without losing any facts.”',
      '<strong>Restructure:</strong> “Suggest a clearer order for these sections.”',
      '<strong>Consistency:</strong> names, terms, dates, UK spelling, tense.',
      '<strong>Plain English:</strong> “Rewrite for a reading age of about 12.”',
      '<strong>Gaps:</strong> “What would a [reader] expect to find here that’s missing?”',
      '<strong>Summaries:</strong> a one-page summary or a five-line overview for busy readers.'
    ]},
    { t: 'h', text: 'Keep control of edits' },
    { t: 'p', html: 'Set boundaries: “Don’t change any facts, figures or names.” “Only edit section 3.” “List your changes after the text.” Boundaries stop helpful-looking edits that quietly change meaning.' },
    { t: 'callout', tone: 'tip', title: 'Use a workspace', html: 'For a big document, keep the outline, any style guide and finished sections in a Project or Gem (Module 12). Every new chat then starts with the full picture.' },
    { t: 'callout', tone: 'warn', title: 'Your name goes on it', html: 'AI can invent references, quotes and statistics (Module 4). Check every one before the document leaves your hands.' }

      prompt: 'I need to write a [type of document] for [reader]. Its purpose is [purpose]. It should be about [length]. Key points to cover: [list them]. Don’t write it yet. Give me an outline: section headings, one line on what each covers, and a suggested word count for each.',

      { q: 'Why draft one section per message?', options: ['It saves paper', 'Long single answers tend to drift and repeat', 'AIs only write one paragraph', 'It’s faster to type'], a: 1, why: 'Shorter pieces keep quality high and let you steer.' },
      { q: 'Which instruction best protects meaning during an edit?', options: ['“Make it better”', '“Don’t change any facts, figures or names”', '“Be creative”', '“Use more words”'], a: 1, why: 'Boundaries stop helpful-looking edits that change meaning.' },

{
  id: 'm19', level: 4, n: 19, mins: 25,
  title: 'Advanced prompt techniques',
  summary: 'Examples, structured tags, prompt chains and other techniques the professionals use.',
  learn: [
    { t: 'p', html: 'The five-part prompt from Module 7 handles most jobs. These techniques are for when you need consistent, repeatable, high-quality output, the kind you would build a workflow around.' },
    { t: 'h', text: '1. Show examples' },
    { t: 'p', html: 'Giving one to three examples of what you want is called [[few-shot|few-shot]] prompting. It is the single most reliable way to control style and format. Make the examples varied, so the AI copies the pattern rather than the exact content.' },
    { t: 'h', text: '2. Label the parts with tags' },
    { t: 'p', html: 'When a prompt mixes instructions, documents and examples, wrap each part in simple tags such as <code>&lt;document&gt;</code> … <code>&lt;/document&gt;</code> or <code>&lt;example&gt;</code> … <code>&lt;/example&gt;</code>. The AI can then tell your instructions apart from your material. Any clear names work; there is no special list.' },
    { t: 'h', text: '3. Chain prompts' },
    { t: 'p', html: '[[Prompt chaining|prompt chaining]] splits a big job into steps, with each step’s output feeding the next. For example: extract the facts, then outline, then draft, then check. Each step is simple, so each is done well, and you can inspect the work between steps.' },
    { t: 'svg', name: 'chain', caption: 'A prompt chain: small, checkable steps instead of one giant request.' },
    { t: 'h', text: '4. Give it a way out' },
    { t: 'p', html: '“If the information isn’t in the document, say ‘not stated’.” “If you’re unsure, say so.” An explicit permission to not know cuts down on invented answers.' },
    { t: 'h', text: '5. Explain why' },
    { t: 'p', html: 'Reasons help the AI generalise. “Keep it under 100 words” works; “Keep it under 100 words because it will be read aloud at the start of training” works better, because the AI also adjusts tone and rhythm.' },
    { t: 'h', text: '6. Generate, then choose' },
    { t: 'p', html: '“Give me five different headline options, then tell me which is strongest and why.” Variety first, judgement second, often beats asking for one perfect answer.' },
    { t: 'callout', tone: 'key', title: 'Combine, don’t pile up', html: 'You rarely need all six at once. Examples plus tags plus a way out covers most professional templates.' }

<script>
/* =========================================================
   AI FLUENCY — APP
   ========================================================= */
(function () {
  'use strict';

  const STORE_KEY = 'aifluency.v1';
  const STAGES = [
    { key: 'learn', label: 'Learn' },
    { key: 'see', label: 'See it' },
    { key: 'try', label: 'Try it' },
    { key: 'check', label: 'Check' },
    { key: 'take', label: 'Take away' }
  ];
  const ANATOMY = {
    role: { label: 'Role', hint: 'Who should the AI act as?', ph: 'You are an experienced, friendly bookkeeper.' },
    task: { label: 'Task', hint: 'What exactly do you want done?', ph: 'Explain what a VAT return is and when I need one.' },
    context: { label: 'Context', hint: 'What background does it need?', ph: 'I’ve just started a small business selling handmade candles.' },
    format: { label: 'Format', hint: 'How should the answer look?', ph: 'Three short paragraphs, then a checklist of next steps.' },
    constraints: { label: 'Constraints', hint: 'Any limits or rules?', ph: 'Plain English, no jargon, under 200 words.' }
  };
  const BUILDER_EXAMPLE = {
    role: 'You are a patient IT helper for people who are new to computers.',
    task: 'Explain how to back up the photos on my Android phone.',
    context: 'I have about 3,000 photos, a Google account, and no idea where to start.',
    format: 'Numbered steps I can follow while holding the phone.',
    constraints: 'Free options only, no technical words, and no more than 8 steps.'
  };

  /* ---------- State ---------- */
  const defaults = () => ({
    theme: 'auto', textSize: 'm', pos: null,
    done: {}, quiz: {}, checks: {}, notes: {},
    scores: {}, scoresDate: null, capstone: {}, library: [], builder: { role: '', task: '', context: '', format: '', constraints: '' },
    seenHero: false
  });
  let S; // assigned by load() once all helpers below are defined
  function load() {
    let raw = null;
    try { raw = localStorage.getItem(STORE_KEY); } catch (e) { return defaults(); }
    if (!raw) return defaults();
    try { return sanitize(JSON.parse(raw)); }
    catch (e) {
      try { localStorage.setItem(STORE_KEY + '.corrupt', raw); } catch (err) { /* nothing more we can do */ }
      return defaults();
    }
  }
  /* Accept only well-formed values from storage or a backup file. */
  function sanitize(raw) {
    const d = defaults();
    const isObj = v => !!v && typeof v === 'object' && !Array.isArray(v);
    const str = (v, max) => typeof v === 'string' ? v.slice(0, max || 20000) : '';
    if (!isObj(raw)) return d;
    if (['auto', 'light', 'dark'].includes(raw.theme)) d.theme = raw.theme;
    if (['m', 'l', 'xl'].includes(raw.textSize)) d.textSize = raw.textSize;
    d.seenHero = raw.seenHero === true;
    if (isObj(raw.pos) && modById(raw.pos.mod)) d.pos = { mod: raw.pos.mod, stage: Math.max(0, Math.min(4, parseInt(raw.pos.stage, 10) || 0)) };
    if (isObj(raw.done)) MODULES.forEach(m => { if (raw.done[m.id] === true) d.done[m.id] = true; });
    if (isObj(raw.quiz)) MODULES.forEach(m => {
      const q = raw.quiz[m.id];
      if (isObj(q) && Array.isArray(q.answers)) d.quiz[m.id] = { answers: q.answers.slice(0, m.check.quiz.length).map((x, i) => Number.isInteger(x) && x >= 0 && x < m.check.quiz[i].options.length ? x : null) };
    });
    if (isObj(raw.checks)) Object.keys(raw.checks).forEach(k => { if (/^[\w-]{1,40}$/.test(k) && Array.isArray(raw.checks[k])) d.checks[k] = raw.checks[k].slice(0, 20).map(v => v === true); });
    if (isObj(raw.notes)) MODULES.forEach(m => { if (typeof raw.notes[m.id] === 'string') d.notes[m.id] = str(raw.notes[m.id]); });
    if (Array.isArray(raw.library)) {
      const seen = new Set();
      d.library = raw.library.filter(isObj).map(x => {
        let id = typeof x.id === 'string' && /^[\w-]{1,40}$/.test(x.id) ? x.id : uid();
        while (seen.has(id)) id = uid();
        seen.add(id);
