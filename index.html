      <rect class="d-box" x="8" y="226" width="104" height="104" rx="14"/><text class="d-t" x="60" y="256" text-anchor="middle">History</text><text class="d-s" x="60" y="280" text-anchor="middle">Kept so you</text><text class="d-s" x="60" y="298" text-anchor="middle">can see past</text><text class="d-s" x="60" y="316" text-anchor="middle">chats</text>
      <rect class="d-box" x="118" y="226" width="104" height="104" rx="14"/><text class="d-t" x="170" y="256" text-anchor="middle">Safety</text><text class="d-s" x="170" y="280" text-anchor="middle">Flagged chats</text><text class="d-s" x="170" y="298" text-anchor="middle">may be read</text><text class="d-s" x="170" y="316" text-anchor="middle">by staff</text>
      <rect class="d-warn" x="228" y="226" width="104" height="104" rx="14"/><text class="d-t" x="280" y="256" text-anchor="middle">Training</text><text class="d-s" x="280" y="280" text-anchor="middle">Only if your</text><text class="d-s" x="280" y="298" text-anchor="middle">setting allows</text><text class="d-s" x="280" y="316" text-anchor="middle">it</text>
      <defs><marker id="ah3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="d-head"/></marker></defs>
    </svg>`
  };

  /* ---------- Shared bits ---------- */
  const ICON = {
    course: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5zM13 4h5.5A1.5 1.5 0 0 1 20 5.5v13a1.5 1.5 0 0 1-1.5 1.5H13z"/></svg>',
    tools: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>',
    library: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12v16l-6-4-6 4z"/></svg>',
    glossary: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19 10 5h1l5 14M7 14h7"/><path d="M17 8h3M17 12h3"/></svg>',
    settings: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>',
    back: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
    copy: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>',
    save: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12v16l-6-4-6 4z"/></svg>',
    check: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    lock: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
    external: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
    trash: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
    edit: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>'
  };

  function anatomyHTML(parts, cls) {
    return `<p class="anatomy ${cls || ''}">${parts.map((p, i) => p.text ? `<span class="hl hl-${p.k}" style="--i:${i}">${esc(p.text)}</span>` : '').join('')}</p>
      <ul class="legend">${parts.filter(p => p.text).map(p => `<li><span class="sw sw-${p.k}"></span>${ANATOMY[p.k].label}</li>`).join('')}</ul>`;
  }

  function aiDot(k) { return `<span class="ai-dot ai-${k}" aria-hidden="true"></span>`; }

  /* ---------- Block renderer ---------- */
  function renderBlock(b, mod) {
    switch (b.t) {
      case 'p': return `<p>${glossify(b.html)}</p>`;
      case 'h': return `<h3>${esc(b.text)}</h3>`;
      case 'list': {
        const tag = b.ordered ? 'ol' : 'ul';
        return `<${tag} class="${b.ordered ? 'steps' : 'bullets'}">${b.items.map(i => `<li>${glossify(i)}</li>`).join('')}</${tag}>`;
      }
      case 'callout': return `<div class="callout c-${b.tone}" role="note"><p class="c-title">${esc(b.title)}</p><p>${glossify(b.html)}</p></div>`;
      case 'svg': return `<figure class="diagram">${SVGS[b.name] || ''}<figcaption>${esc(b.caption)}</figcaption></figure>`;
      case 'compare': return `<div class="compare">
          ${['weak', 'strong'].map(k => `<div class="cmp cmp-${k}">
            <p class="cmp-title"><span class="cmp-mark" aria-hidden="true">${k === 'weak' ? '✕' : '✓'}</span><span class="sr">${k === 'weak' ? 'Weaker example: ' : 'Stronger example: '}</span>${esc(b[k].label)}</p>
            <p class="mono-quote">${esc(b[k].text)}</p>
            <ul>${b[k].why.map(w => `<li>${esc(w)}</li>`).join('')}</ul></div>`).join('')}
        </div>`;
      case 'table': return `<div class="table-wrap" tabindex="0" role="region" aria-label="${esc('Table: ' + b.head.map(h => h.replace(/<[^>]+>/g, '').trim()).filter(Boolean).join(', '))}"><table${b.head.length > 2 ? ' class="wide"' : ''}><thead><tr>${b.head.map(h => `<th scope="col">${h || '<span class="sr">Item</span>'}</th>`).join('')}</tr></thead>
          <tbody>${b.rows.map(r => `<tr>${r.map((c, i) => i === 0 ? `<th scope="row">${glossify(c)}</th>` : `<td>${glossify(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
      case 'transcript': return `<div class="transcript">${b.turns.map(t => `<div class="turn turn-${t.who}"><span class="who">${t.who === 'you' ? 'You' : 'AI'}</span><p>${esc(t.text).replace(/\n/g, '<br>')}</p></div>`).join('')}</div>`;
      case 'anatomy': return `<div class="anatomy-wrap">${anatomyHTML(b.parts)}</div>`;
      case 'reveal': return `<details class="reveal"><summary>${esc(b.label)}</summary><div>${b.html}</div></details>`;
      case 'platforms': return `<div class="platforms">${AI_ORDER.map(k => {
          const p = PLATFORMS[k];
          return `<article class="plat">
            <header>${aiDot(k)}<h3>${p.name}</h3><span class="plat-by">${p.maker}, ${p.country}</span></header>
            <dl>
              <dt>Where</dt><dd>${p.site}. Apps for ${p.apps}.</dd>
              <dt>Free version</dt><dd>${p.free}</dd>
              <dt>Stands out for</dt><dd>${p.best}</dd>
              <dt>Watch out</dt><dd>${p.watch}</dd>
            </dl>
            <a class="btn btn-ghost btn-sm" href="${p.open}" target="_blank" rel="noopener noreferrer">${ICON.external}Open ${p.name}</a>
          </article>`; }).join('')}</div>
          <p class="checked-note">Details last checked ${LAST_CHECKED}. Features and plans change often.</p>`;
      case 'privacy': return `<div class="privacy">${AI_ORDER.map(k => {
          const p = PLATFORMS[k].privacy;
          return `<details class="priv"${k === 'claude' ? ' open' : ''}><summary>${aiDot(k)}${PLATFORMS[k].name}</summary>
            <ol class="steps"><li>${p.where}</li><li>${p.toggle}</li><li>${p.temp}</li></ol></details>`; }).join('')}</div>
          <p class="checked-note">Setting names last checked ${LAST_CHECKED}. If a menu has moved, search the app’s help pages for “training” or “data controls”.</p>`;
      case 'exercise': return exerciseHTML(b);
      case 'cta': return `<div class="callout c-key cta" role="note"><p>${glossify(b.html)}</p><a class="btn btn-primary btn-sm" href="${b.href}">${esc(b.label)}</a></div>`;
      case 'personal': return `<div class="privacy">${AI_ORDER.map(k => {
          const p = PLATFORMS[k].personal;
          return `<details class="priv"${k === 'claude' ? ' open' : ''}><summary>${aiDot(k)}${PLATFORMS[k].name}</summary>
            <dl class="pers"><dt>Instructions</dt><dd>${p.instructions}</dd><dt>Memory</dt><dd>${p.memory}</dd><dt>Workspaces</dt><dd>${p.workspace}</dd></dl></details>`; }).join('')}</div>
          <p class="checked-note">Menu names last checked ${LAST_CHECKED}. If something has moved, look under Settings for “Personalization”, “Memory” or “Personal context”.</p>`;
      case 'scorecard': return scorecardHTML();
      case 'capstone': return capstoneHTML();
      case 'code': return `<div class="prompt code-block"><pre tabindex="0" role="region" aria-label="Code example">${esc(b.text)}</pre><div class="prompt-acts"><button class="btn btn-primary btn-sm" data-act="copy" data-text="${esc(b.text)}">${ICON.copy}Copy code</button></div></div>`;
      case 'checked': return `<p class="checked-note">Feature details last checked ${LAST_CHECKED}. Names, menus and free-plan limits change often.</p>`;
      default: return '';
    }
  }

  function exerciseHTML(b) {
    const ticks = S.checks[b.id] || [];
    const saved = b.prompt ? inLibrary(b.prompt) : false;
    return `<section class="ex" id="${b.id}">
      <header class="ex-head"><h3>${esc(b.title)}</h3><span class="mins">${b.mins} min</span></header>
      <p>${glossify(b.intro)}</p>
      ${b.prompt ? `<div class="prompt">
          <pre>${esc(b.prompt)}</pre>
          <div class="prompt-acts">
            <button class="btn btn-primary btn-sm" data-act="copy" data-text="${esc(b.prompt)}">${ICON.copy}Copy prompt</button>
            <button class="btn btn-ghost btn-sm${saved ? ' is-saved' : ''}" data-act="savePrompt" data-title="${esc(b.title)}" data-text="${esc(b.prompt)}">${ICON.save}${saved ? 'Saved' : 'Save'}</button>
          </div></div>` : ''}
      ${b.steps ? `<ol class="steps">${b.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol>` : ''}
      ${b.noOpen ? '' : `<div class="open-row"><span>Open in</span>${AI_ORDER.map(k => `<a class="chip" href="${PLATFORMS[k].open}" target="_blank" rel="noopener noreferrer">${aiDot(k)}${PLATFORMS[k].name}</a>`).join('')}</div>`}
      ${b.notes ? `<div class="notes-tabs" data-ex="${b.id}">
          <div class="tabs" role="tablist" aria-label="Tips for each AI">${AI_ORDER.map((k, i) => `<button type="button" role="tab" id="${b.id}-tab-${k}" aria-controls="${b.id}-panel" aria-selected="${i === 0}" tabindex="${i === 0 ? 0 : -1}" data-act="tab" data-k="${k}">${PLATFORMS[k].name}</button>`).join('')}</div>
          <p class="tab-panel" role="tabpanel" id="${b.id}-panel" aria-labelledby="${b.id}-tab-${AI_ORDER[0]}" tabindex="0">${esc(b.notes[AI_ORDER[0]])}</p></div>` : ''}
      ${b.check ? `<fieldset class="selfcheck"><legend>Check yourself</legend>${b.check.map((c, i) => `<label class="tick"><input type="checkbox" data-act="tick" data-id="${b.id}" data-i="${i}"${ticks[i] ? ' checked' : ''}><span class="box">${ICON.check}</span><span>${esc(c)}</span></label>`).join('')}</fieldset>` : ''}
    </section>`;
  }

  /* ---------- Head-to-head scorecard ---------- */
  let scoreClearArmed = false;
  function scorecardHTML() {
    const sc = S.scores || {};
    const tasks = SCORE_TASKS.map((t, ti) => {
      const row = sc[t.id] || {};
      return `<section class="ex sc-task" id="sc-${t.id}">
        <header class="ex-head"><h3>Task ${ti + 1}: ${esc(t.title)}</h3><span class="mins">${AI_ORDER.filter(k => row[k]).length}/4 scored</span></header>
        <div class="prompt"><pre>${esc(t.prompt)}</pre>
          <div class="prompt-acts"><button class="btn btn-primary btn-sm" data-act="copy" data-text="${esc(t.prompt)}">${ICON.copy}Copy prompt</button></div></div>
        <p class="look"><strong>Look for:</strong> ${esc(t.look)}</p>
        <div class="rates">${AI_ORDER.map(k => `<div class="rate" role="group" aria-label="Score for ${PLATFORMS[k].name}">
            <a class="rate-name" href="${PLATFORMS[k].open}" target="_blank" rel="noopener noreferrer">${aiDot(k)}${PLATFORMS[k].name}</a>
            <div class="rate-btns">${[1, 2, 3, 4, 5].map(n => `<button type="button" class="rb${row[k] === n ? ' is-on' : ''}" aria-pressed="${row[k] === n}" aria-label="${n} out of 5" data-act="score" data-t="${t.id}" data-k="${k}" data-n="${n}">${n}</button>`).join('')}</div>
          </div>`).join('')}</div>
      </section>`;
    }).join('');
    return `<p>Work through the tasks in any order. Copy each prompt, run it in a fresh chat in each AI, then tap a score. Tap a score again to clear it.</p>${tasks}${scoreSummaryHTML()}`;
  }
  function scoreSummaryHTML() {
    const sc = S.scores || {};
    const any = SCORE_TASKS.some(t => sc[t.id] && AI_ORDER.some(k => sc[t.id][k]));
    if (!any) return `<div class="empty-state sc-empty"><h2>Your results appear here</h2><p>Score at least one answer to start your comparison table.</p></div>`;
    const totals = {}, counts = {};
    AI_ORDER.forEach(k => { totals[k] = 0; counts[k] = 0; });
    const rows = SCORE_TASKS.map(t => {
      const r = sc[t.id] || {};
      const max = Math.max(0, ...AI_ORDER.map(k => r[k] || 0));
      return `<tr><th scope="row">${esc(t.title)}</th>${AI_ORDER.map(k => {
        const v = r[k];
        if (v) { totals[k] += v; counts[k]++; }
        return `<td class="${v && v === max ? 'is-top' : ''}">${v || '–'}</td>`;
      }).join('')}</tr>`;
    }).join('');
    const avg = k => counts[k] ? totals[k] / counts[k] : 0;
    const ranked = AI_ORDER.filter(k => counts[k]).sort((x, y) => avg(y) - avg(x));
    const lead = ranked[0];
    return `<section class="sc-results" aria-live="polite">
      <h3>Your results</h3>
      ${S.scoresDate ? `<p class="checked-note">Last scored ${esc(S.scoresDate)}.</p>` : ''}
      <div class="table-wrap" tabindex="0" role="region" aria-label="Scorecard results"><table class="sc-table"><thead><tr><th scope="col">Task</th>${AI_ORDER.map(k => `<th scope="col">${PLATFORMS[k].name}</th>`).join('')}</tr></thead>
        <tbody>${rows}<tr class="sc-avg"><th scope="row">Average</th>${AI_ORDER.map(k => `<td>${counts[k] ? avg(k).toFixed(1) : '–'}</td>`).join('')}</tr></tbody></table></div>
      ${(() => { const tied = ranked.filter(k => avg(k) === avg(lead));
        return tied.length > 1
          ? `<p class="sc-lead"><span><strong>${tied.map(k => PLATFORMS[k].name).join(' and ')}</strong> are level so far, each averaging ${avg(lead).toFixed(1)}. Score more tasks to separate them.</span></p>`
          : `<p class="sc-lead">${aiDot(lead)}<span><strong>${PLATFORMS[lead].name}</strong> leads so far, averaging ${avg(lead).toFixed(1)} across ${counts[lead]} task${counts[lead] === 1 ? '' : 's'}.</span></p>`; })()}
      <button class="btn ${scoreClearArmed ? 'btn-danger' : 'btn-ghost'} btn-sm" data-act="scoreClear">${scoreClearArmed ? 'Press again to clear all scores' : 'Clear all scores'}</button>
    </section>`;
  }

  /* ---------- Capstone worksheet ---------- */
  function capText() {
    const c = S.capstone || {};
    const lines = CAPSTONE.filter(f => (c[f.k] || '').trim()).map(f => `${f.label}: ${c[f.k].trim()}`);
    return lines.length ? `My AI assistant design\n\n${lines.join('\n')}` : '';
  }
  function capstoneHTML() {
    const c = S.capstone || {};
    const t = capText();
    return `<section class="ex cap"><header class="ex-head"><h3>Design worksheet</h3><span class="mins">12 min</span></header>
      <p>Fill in what you can. It saves as you type, and you can come back to it any time.</p>
      <div class="builder">${CAPSTONE.map(f => `<label class="bfield"><span class="bf-label">${esc(f.label)}<span class="bf-hint">${esc(f.hint)}</span></span>
        <textarea rows="2" data-act="cap" data-k="${f.k}" placeholder="${esc(f.ph)}">${esc(c[f.k] || '')}</textarea></label>`).join('')}</div>
      <h4 class="cap-h">Your design</h4>
      <div class="prompt"><pre id="cap-out">${t ? esc(t) : 'Start filling in the boxes above.'}</pre>
        <div class="prompt-acts"><button class="btn btn-primary btn-sm" data-act="copyCap">${ICON.copy}Copy design</button>
        <button class="btn btn-ghost btn-sm" data-act="saveCap">${ICON.save}Save to library</button></div></div>
    </section>`;
  }

  /* ---------- Views ---------- */
  function viewHome() {
    const nx = nextModule();
    const tp = totalProgress();
    const heroParts = [
      { k: 'role', text: 'You are a patient tutor. ' },
      { k: 'task', text: 'Teach me how to get useful answers from AI, ' },
      { k: 'context', text: 'starting from zero. ' },
      { k: 'format', text: 'Short lessons with hands-on practice, ' },
      { k: 'constraints', text: 'about 25 minutes each.' }
    ];
    const anim = !S.seenHero ? ' animate' : '';
    S.seenHero = true; save();
    return `<div class="home">
      <section class="hero">
        <h1>Learn to get great results from AI.</h1>
        <p class="lede">Short, hands-on modules across Claude, ChatGPT, Gemini and DeepSeek. Start from zero and finish by designing your own AI assistant.</p>
        <div class="hero-prompt${anim}">${anatomyHTML(heroParts, 'big')}</div>
        <div class="hero-cta">
          ${nx ? `<a class="btn btn-primary btn-lg" href="#/m/${nx.mod.id}/${nx.stage}">${S.pos || tp.done ? 'Continue' : 'Start'} Module ${nx.mod.n}<span class="btn-sub">${esc(nx.mod.title)}${nx.stage ? `, ${STAGES[nx.stage].label}` : ''}</span></a>`
          : `<p class="all-done">${ICON.check} ${OUTLINE.length ? `${liveLevelsText()} complete. The next levels arrive in a future update.` : 'Course complete. You’ve finished all 24 modules.'}</p>`}
        </div>
        <div class="overall" aria-label="Course progress"><div class="bar"><span style="width:${tp.pct}%"></span></div><span>${tp.done} of ${tp.total} modules complete</span></div>
      </section>
      ${LEVELS.map(levelHTML).join('')}
    </div>`;
  }

  function levelHTML(L) {
    const lp = levelProgress(L.n);
    const live = MODULES.filter(m => m.level === L.n);
    const rows = live.length ? live.map(m => {
      const done = S.done[m.id], cur = S.pos && S.pos.mod === m.id && !done;
      return `<li><a class="mod-row${done ? ' is-done' : ''}${cur ? ' is-current' : ''}" href="#/m/${m.id}/${cur ? S.pos.stage : 0}">
        <span class="mod-n">${done ? ICON.check : m.n}</span>
        <span class="mod-txt"><strong>${esc(m.title)}</strong><span>${esc(m.summary)}</span></span>
        <span class="mod-meta">${cur ? 'In progress' : `${m.mins} min`}</span></a></li>`;
    }).join('') : OUTLINE.filter(o => o.level === L.n).map(o => `<li><button type="button" class="mod-row is-locked" data-act="locked">
        <span class="mod-n">${o.n}</span>
        <span class="mod-txt"><strong>${esc(o.title)}</strong><span>${esc(o.summary)}</span></span>
        <span class="mod-meta">${ICON.lock}<span class="sr">Coming soon</span></span></button></li>`).join('');
    return `<section class="level" aria-labelledby="lv${L.n}">
      <header class="level-head"><div><h2 id="lv${L.n}">Level ${L.n}: ${L.title}</h2><p>${L.blurb}</p></div>
      ${live.length ? `<span class="level-count">${lp.done}/${lp.total}</span>` : '<span class="level-count soon">Coming next</span>'}</header>
      <ol class="mods">${rows}</ol></section>`;
  }

  function viewModule(id, stageIdx) {
    const m = modById(id);
    if (!m) return viewHome();
    stageIdx = Math.max(0, Math.min(4, stageIdx | 0));
    S.pos = { mod: id, stage: stageIdx }; save();
    const st = STAGES[stageIdx].key;
    let body = '';
    if (st === 'check') body = checkHTML(m);
    else if (st === 'take') body = takeHTML(m);
    else body = m[st].map(b => renderBlock(b, m)).join('');
    return `<div class="module" data-mod="${id}">
      <header class="mod-head">
        <p class="mod-kicker">Level ${m.level}, Module ${m.n} <span class="mins">${m.mins} min</span></p>
        <h1>${esc(m.title)}</h1>
        <nav class="stepper" aria-label="Module stages"><ol>${STAGES.map((s, i) => `<li><a href="#/m/${id}/${i}" class="${i === stageIdx ? 'is-on' : ''}${i < stageIdx ? ' is-past' : ''}"${i === stageIdx ? ' aria-current="step"' : ''}><span class="st-n">${i + 1}</span><span class="st-l">${s.label}</span></a></li>`).join('')}</ol></nav>
      </header>
      <article class="stage stage-${st}">
        <h2 class="stage-title">${STAGES[stageIdx].label}</h2>
        ${body}
      </article>
      <div class="stage-bar">
        ${stageIdx > 0 ? `<a class="btn btn-ghost" href="#/m/${id}/${stageIdx - 1}">${ICON.back}<span>${STAGES[stageIdx - 1].label}</span></a>` : `<a class="btn btn-ghost" href="#/">${ICON.back}<span>Course</span></a>`}
        ${stageIdx < 4 ? `<a class="btn btn-primary" href="#/m/${id}/${stageIdx + 1}">Next: ${STAGES[stageIdx + 1].label}</a>`
          : `<button class="btn btn-primary" data-act="finish" data-id="${id}">${S.done[id] ? 'Module complete' : 'Finish module'}</button>`}
      </div>
    </div>`;
  }

  function checkHTML(m) {
    const q = S.quiz[m.id] || {};
    const ans = q.answers || [];
    const allDone = m.check.quiz.every((_, i) => ans[i] != null);
    const score = m.check.quiz.reduce((n, qq, i) => n + (ans[i] === qq.a ? 1 : 0), 0);
    const ticks = S.checks[m.id + '-self'] || [];
    return `<p>Answer each question. You’ll see why straight away.</p>
      <div class="quiz">${m.check.quiz.map((qq, i) => {
        const a = ans[i];
        return `<fieldset class="q${a != null ? ' answered' : ''}"><legend><span class="q-n">${i + 1}</span>${esc(qq.q)}</legend>
          <div class="opts">${qq.options.map((o, j) => {
            let cls = '';
            if (a != null) { if (j === qq.a) cls = ' is-right'; else if (j === a) cls = ' is-wrong'; }
            return `<button type="button" class="opt${cls}" data-act="answer" data-mod="${m.id}" data-q="${i}" data-o="${j}"${a != null ? ' disabled' : ''}>${esc(o)}</button>`;
          }).join('')}</div>
          ${a != null ? `<p class="why" id="why-${m.id}-${i}" tabindex="-1"><strong>${a === qq.a ? 'Correct.' : 'Not quite.'}</strong> ${esc(qq.why)}</p>` : ''}
        </fieldset>`;
      }).join('')}</div>
      ${allDone ? `<div class="score"><p><strong>You scored ${score} of ${m.check.quiz.length}.</strong> ${score === m.check.quiz.length ? 'Spot on.' : 'Read the explanations above, then try again if you like.'}</p><button class="btn btn-ghost btn-sm" data-act="retry" data-mod="${m.id}">Try again</button></div>` : ''}
      <fieldset class="selfcheck big"><legend>Before you move on, can you say yes to these?</legend>
        ${m.check.self.map((c, i) => `<label class="tick"><input type="checkbox" data-act="tick" data-id="${m.id}-self" data-i="${i}"${ticks[i] ? ' checked' : ''}><span class="box">${ICON.check}</span><span>${esc(c)}</span></label>`).join('')}
      </fieldset>`;
  }

  function takeHTML(m) {
    const nx = MODULES.find(x => x.n === m.n + 1);
    return `<div class="cheat"><h3>${esc(m.title)}: the essentials</h3><ul>${m.take.cheat.map(c => `<li>${esc(c)}</li>`).join('')}</ul></div>
      <h3>Prompts to keep</h3>
      <div class="keep">${m.take.save.map(s => {
        const saved = inLibrary(s.text);
        return `<div class="keep-item"><div><strong>${esc(s.title)}</strong><pre>${esc(s.text)}</pre></div>
          <button class="btn btn-ghost btn-sm${saved ? ' is-saved' : ''}" data-act="savePrompt" data-title="${esc(s.title)}" data-text="${esc(s.text)}" data-tags="${esc(s.tags.join(','))}">${ICON.save}${saved ? 'Saved' : 'Save'}</button></div>`;
      }).join('')}</div>
      <label class="notes"><span>My notes</span><textarea data-act="note" data-mod="${m.id}" rows="5" placeholder="What surprised you? What will you try next?">${esc(S.notes[m.id] || '')}</textarea></label>
      <p class="next-up">${nx ? `${nx.level !== m.level ? `That’s the end of Level ${m.level}. ` : ''}Next up: <strong>Module ${nx.n}, ${esc(nx.title)}</strong>.` : (OUTLINE.length ? `That’s the end of Level ${m.level}. Level ${m.level + 1} arrives in the next update.` : 'That’s the final module. Press Finish to complete the course. Your library, notes, scorecard and design stay saved here whenever you need them.')}</p>`;
  }

  function viewTools(tab) {
    tab = tab === 'picker' ? 'picker' : 'builder';
    return `<div class="page">
      <h1>Tools</h1>
      <nav class="seg" aria-label="Tools"><a href="#/tools/builder"${tab === 'builder' ? ' aria-current="page"' : ''}>Prompt builder</a><a href="#/tools/picker"${tab === 'picker' ? ' aria-current="page"' : ''}>Which AI?</a></nav>
      ${tab === 'builder' ? builderHTML() : pickerHTML()}
    </div>`;
  }

  function builderPrompt() {
    return Object.keys(ANATOMY).map(k => (S.builder[k] || '').trim()).filter(Boolean).join(' ');
  }
  function builderHTML() {
    return `<p class="lede-sm">Fill in any of the five parts. The more you add, the better the answer. Your prompt builds itself as you type.</p>
      <div class="bwrap"><div class="builder">${Object.keys(ANATOMY).map(k => `<label class="bfield bf-${k}">
          <span class="bf-label"><span class="sw sw-${k}"></span>${ANATOMY[k].label}<span class="bf-hint">${ANATOMY[k].hint}</span></span>
          <textarea rows="2" data-act="build" data-k="${k}" placeholder="${esc(ANATOMY[k].ph)}">${esc(S.builder[k])}</textarea></label>`).join('')}
      </div>
      <div class="built"><h2>Your prompt</h2><div id="built-out">${builtOut()}</div>
        <div class="built-acts">
          <button class="btn btn-primary" data-act="copyBuilt">${ICON.copy}Copy prompt</button>
          <button class="btn btn-ghost" data-act="saveBuilt">${ICON.save}Save to library</button>
          <button class="btn btn-ghost" data-act="exampleBuilt">Load an example</button>
          <button class="btn btn-text" data-act="clearBuilt">Clear</button>
        </div></div></div>`;
  }
  function builtOut() {
    const parts = Object.keys(ANATOMY).map(k => ({ k, text: (S.builder[k] || '').trim() ? S.builder[k].trim() + ' ' : '' }));
    return parts.some(p => p.text) ? anatomyHTML(parts) : '<p class="empty">Start typing in any box above.</p>';
  }

  const PICK = { task: null, sensitive: null };
  const TASKS = [
    ['write', 'Write or edit text'], ['google', 'Work with Gmail, Docs or Maps'], ['media', 'Create an image or talk by voice'],
    ['logic', 'Maths, logic or code'], ['research', 'Look into a current topic']
  ];
  function pickerHTML() {
    return `<p class="lede-sm">Two quick questions and you’ll get a sensible place to start.</p>
      <fieldset class="pick"><legend>What do you need to do?</legend><div class="chips">${TASKS.map(([k, l]) => `<button type="button" class="chip-btn${PICK.task === k ? ' is-on' : ''}" aria-pressed="${PICK.task === k}" data-act="pick" data-f="task" data-v="${k}">${l}</button>`).join('')}</div></fieldset>
      <fieldset class="pick"><legend>Does it involve personal or confidential information?</legend><div class="chips">
        <button type="button" class="chip-btn${PICK.sensitive === true ? ' is-on' : ''}" aria-pressed="${PICK.sensitive === true}" data-act="pick" data-f="sensitive" data-v="yes">Yes</button>
        <button type="button" class="chip-btn${PICK.sensitive === false ? ' is-on' : ''}" aria-pressed="${PICK.sensitive === false}" data-act="pick" data-f="sensitive" data-v="no">No</button></div></fieldset>
      ${pickResult()}`;
  }
  function pickResult() {
    if (!PICK.task || PICK.sensitive == null) return '';
    const R = {
      write: ['claude', 'chatgpt', 'Claude is known for clear, natural writing and handles long documents well.'],
      google: ['gemini', 'chatgpt', 'Gemini links straight into your Google account, so it can work with Gmail, Docs, Drive and Maps.'],
      media: ['chatgpt', 'gemini', 'ChatGPT has the most complete image creation and voice conversation features.'],
      logic: ['deepseek', 'claude', 'DeepSeek is strong at maths, logic and code, and it’s free.'],
      research: ['gemini', 'chatgpt', 'Gemini draws on Google Search, and both show sources you can check.']
    }[PICK.task];
    let [first, alt, why] = R;
    let note = '';
    if (PICK.sensitive) {
      if (first === 'deepseek') { first = 'claude'; alt = 'chatgpt'; why = 'Claude is strong at logic and code too, and keeps your data out of DeepSeek’s servers in China.'; }
      note = `<aside class="callout c-warn"><h4>Before you paste anything</h4><p>Anonymise first, use a temporary or incognito chat, and check your training setting (Module 5). Avoid DeepSeek’s app for personal data.</p></aside>`;
    }
    return `<div class="result" aria-live="polite">
      <p class="res-label">Try first</p>
      <h2>${aiDot(first)}${PLATFORMS[first].name}</h2><p>${why}</p>
      <p class="res-alt">Also good: ${aiDot(alt)}<strong>${PLATFORMS[alt].name}</strong></p>
      <a class="btn btn-primary" href="${PLATFORMS[first].open}" target="_blank" rel="noopener noreferrer">${ICON.external}Open ${PLATFORMS[first].name}</a>
      ${note}
      <p class="checked-note">A starting point, not a rule. Module 11 has you test all four head to head.</p></div>`;
  }

  let libQuery = '', libEditing = null;
  function viewLibrary() {
    const q = libQuery.toLowerCase();
    const items = S.library.filter(x => !q || (x.title + ' ' + x.text + ' ' + x.tags.join(' ')).toLowerCase().includes(q));
    let ed = libEditing ? (libEditing === 'new' ? { title: '', text: '', tags: [] } : S.library.find(x => x.id === libEditing)) : null;
    if (libEditing && !ed) { libEditing = null; ed = null; }
    return `<div class="page">
      <div class="page-head"><h1>My prompt library</h1><button class="btn btn-primary btn-sm" data-act="libNew">New prompt</button></div>
      ${ed ? `<form class="lib-form" data-act="libSave">
          <label><span>Title</span><input name="title" value="${esc(ed.title)}" required maxlength="80"></label>
          <label><span>Prompt</span><textarea name="text" rows="6" required>${esc(ed.text)}</textarea></label>
          <label><span>Tags (comma separated)</span><input name="tags" value="${esc(ed.tags.join(', '))}"></label>
          <div class="row"><button class="btn btn-primary" type="submit">Save prompt</button><button class="btn btn-text" type="button" data-act="libCancel">Cancel</button></div></form>` : ''}
      ${S.library.length ? `<label class="search"><span class="sr">Search prompts</span><input type="search" data-act="libSearch" placeholder="Search your prompts" value="${esc(libQuery)}"></label>` : ''}
      ${items.length ? `<ul class="lib">${items.map(x => `<li class="lib-item">
          <h3>${esc(x.title)}</h3>${x.tags.length ? `<p class="tags">${x.tags.map(t => `<span>${esc(t)}</span>`).join('')}</p>` : ''}
          <pre tabindex="0" role="region" aria-label="Prompt text">${esc(x.text)}</pre>
          <div class="row"><button class="btn btn-primary btn-sm" data-act="copy" data-text="${esc(x.text)}">${ICON.copy}Copy</button>
          <button class="btn btn-ghost btn-sm" data-act="libEdit" data-id="${esc(x.id)}">${ICON.edit}Edit</button>
          <button class="btn btn-text btn-sm" data-act="libDel" data-id="${esc(x.id)}">${ICON.trash}Delete</button></div></li>`).join('')}</ul>`
        : S.library.length ? '<p class="empty">No prompts match that search.</p>'
        : `<div class="empty-state"><h2>Your library is empty</h2><p>Press <strong>Save</strong> on any prompt in a module, use the Prompt builder, or add your own with <strong>New prompt</strong>.</p></div>`}
    </div>`;
  }

  let glQuery = '';
  function viewGlossary() {
    const q = glQuery.toLowerCase();
    const keys = Object.keys(GLOSSARY).sort((a, b) => GLOSSARY[a][0].localeCompare(GLOSSARY[b][0]))
      .filter(k => !q || (GLOSSARY[k][0] + ' ' + GLOSSARY[k][1]).toLowerCase().includes(q));
    return `<div class="page"><h1>Glossary</h1><p class="lede-sm">Every term used in the course, in plain English. Underlined words in lessons open these too.</p>
      <label class="search"><span class="sr">Search the glossary</span><input type="search" data-act="glSearch" placeholder="Search terms" value="${esc(glQuery)}"></label>
      ${keys.length ? `<dl class="gloss">${keys.map(k => `<div><dt>${esc(GLOSSARY[k][0])}</dt><dd>${esc(GLOSSARY[k][1])}</dd></div>`).join('')}</dl>` : '<p class="empty">No terms match that search.</p>'}</div>`;
  }

  let resetArmed = false;
  function viewSettings() {
    const opt = (f, v, l) => `<button type="button" class="chip-btn${S[f] === v ? ' is-on' : ''}" aria-pressed="${S[f] === v}" data-act="pref" data-f="${f}" data-v="${v}">${l}</button>`;
    return `<div class="page"><h1>Settings</h1>
      <section class="set"><h2>Appearance</h2><div class="chips">${opt('theme', 'auto', 'Match device')}${opt('theme', 'light', 'Light')}${opt('theme', 'dark', 'Dark')}</div></section>
      <section class="set"><h2>Text size</h2><div class="chips">${opt('textSize', 'm', 'Standard')}${opt('textSize', 'l', 'Large')}${opt('textSize', 'xl', 'Extra large')}</div></section>
      <section class="set"><h2>Backup</h2><p>Your progress, notes and prompt library are stored on this device only. Save a backup file to move them to another device.</p>
        <div class="row"><button class="btn btn-ghost" data-act="export">Save backup file</button>
        <label class="btn btn-ghost file-btn">Restore from backup file<input type="file" accept="application/json,.json" data-act="import"></label></div>
        <h3 class="set-sub">No file downloads on this device?</h3>
        <p>Copy your backup as text and paste it somewhere safe, such as a note or an email to yourself. To restore, paste it into the box below.</p>
        <div class="row"><button class="btn btn-ghost" data-act="copyBackup">Copy backup as text</button></div>
        <label class="restore"><span>Paste a backup to restore</span><textarea id="restore-text" rows="3" placeholder='Starts with {"app":"aifluency"'></textarea></label>
        <div class="row"><button class="btn btn-ghost" data-act="restoreText">Restore from text</button></div></section>
      <section class="set"><h2>Start over</h2><p>Clears progress, quiz scores, ticks and notes. Your prompt library is kept.</p>
        <button class="btn ${resetArmed ? 'btn-danger' : 'btn-ghost'}" data-act="reset">${resetArmed ? 'Press again to clear progress' : 'Clear progress'}</button></section>
      <section class="set about"><h2>About</h2><p>AI Fluency works fully offline. Buttons that open Claude, ChatGPT, Gemini or DeepSeek take you to their own websites. Platform details last checked ${LAST_CHECKED}.</p><p>Companion course to Copilot Essentials.</p></section>
    </div>`;
  }

  /* ---------- Router ---------- */
  function route() {
    const parts = (location.hash || '#/').replace(/^#\/?/, '').split('/');
    const main = $('#main');
    let html, tab = 'course', inModule = false;
    if (parts[0] === 'm' && modById(parts[1])) { html = viewModule(parts[1], parseInt(parts[2], 10) || 0); inModule = true; }
    else if (parts[0] === 'tools') { html = viewTools(parts[1]); tab = 'tools'; }
    else if (parts[0] === 'library') { html = viewLibrary(); tab = 'library'; }
    else if (parts[0] === 'glossary') { html = viewGlossary(); tab = 'glossary'; }
    else if (parts[0] === 'settings') { html = viewSettings(); tab = 'settings'; }
    else html = viewHome();
    resetArmed = parts[0] === 'settings' ? resetArmed : false;
    main.innerHTML = html;
    document.body.classList.toggle('in-module', inModule);
    $$('.nav a').forEach(a => a.setAttribute('aria-current', a.dataset.tab === tab ? 'page' : 'false'));
    renderRail();
    if (!route.keepScroll) window.scrollTo(0, 0);
    route.keepScroll = false;
    const h = main.querySelector('h1');
    if (h && route.focus) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
    route.focus = true;
  }
  function focusKey(el) {
    if (!el || el === document.body || !el.dataset || !el.dataset.act) return null;
    return el.tagName.toLowerCase() + Object.entries(el.dataset)
      .filter(([k]) => k !== 'armed')
      .map(([k, v]) => `[data-${k.replace(/[A-Z]/g, c => '-' + c.toLowerCase())}="${CSS.escape(v)}"]`).join('');
  }
  function rerender(focusSel) {
    const key = focusSel || focusKey(document.activeElement);
    route.keepScroll = true; route.focus = false;
    const y = window.scrollY; route(); window.scrollTo(0, y);
    if (key) { const n = document.querySelector(key); if (n && !n.disabled) n.focus({ preventScroll: true }); }
  }

  function renderRail() {
    const rail = $('#rail-progress');
    if (!rail) return;
    rail.innerHTML = LEVELS.map(L => {
      const lp = levelProgress(L.n);
      const live = MODULES.some(m => m.level === L.n);
      return `<li><span>Level ${L.n}: ${L.title}</span><span class="bar"><span style="width:${live ? Math.round(lp.done / lp.total * 100) : 0}%"></span></span></li>`;
    }).join('');
  }

  /* ---------- Sheet (glossary popover) ---------- */
  let lastFocus = null;
  function openSheet(k) {
    const g = GLOSSARY[k]; if (!g) return;
    lastFocus = document.activeElement;
    $('#sheet-title').textContent = g[0];
    $('#sheet-body').textContent = g[1];
    $('#sheet').hidden = false;
    requestAnimationFrame(() => $('#sheet').classList.add('open'));
    $('#sheet-close').focus();
  }
  function closeSheet() {
    const s = $('#sheet');
    s.classList.remove('open');
    setTimeout(() => { s.hidden = true; }, 180);
    if (lastFocus) lastFocus.focus();
  }

  /* ---------- Events ---------- */
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act;
    switch (act) {
      case 'term': openSheet(el.dataset.term); break;
      case 'copy': copyText(el.dataset.text); break;
      case 'savePrompt':
        if (addToLibrary({ title: el.dataset.title, text: el.dataset.text, tags: (el.dataset.tags || '').split(',').filter(Boolean) })) {
          el.classList.add('is-saved'); el.innerHTML = ICON.save + 'Saved';
        }
        break;
      case 'tab': {
        const wrap = el.closest('.notes-tabs');
        const ex = MODULES.flatMap(m => [...m.learn, ...m.see, ...m.try]).find(b => b.id === wrap.dataset.ex);
        if (!ex || !ex.notes) break;
        $$('[role=tab]', wrap).forEach(t => { const on = t === el; t.setAttribute('aria-selected', on); t.tabIndex = on ? 0 : -1; });
        const panel = $('.tab-panel', wrap);
        panel.textContent = ex.notes[el.dataset.k];
        panel.setAttribute('aria-labelledby', el.id);
        break;
      }
      case 'answer': {
        const id = el.dataset.mod, qi = +el.dataset.q, o = +el.dataset.o;
        S.quiz[id] = S.quiz[id] || { answers: [] };
        S.quiz[id].answers[qi] = o;
        save(); rerender(`#why-${id}-${qi}`);
        break;
      }
      case 'retry': S.quiz[el.dataset.mod] = { answers: [] }; save(); rerender(`[data-act="answer"][data-mod="${el.dataset.mod}"][data-q="0"][data-o="0"]`); break;
      case 'finish': {
        const id = el.dataset.id, m = modById(id);
        const first = !S.done[id];
        S.done[id] = true; S.pos = null; save(true);
        const nx = MODULES.find(x => x.n === m.n + 1);
        const lvlDone = MODULES.filter(x => x.level === m.level).every(x => S.done[x.id]);
        const allDone = MODULES.every(x => S.done[x.id]) && !OUTLINE.length;
        if (first) toast(allDone ? 'Course complete. Brilliant work.' : lvlDone ? `Level ${m.level} complete. Well done.` : `Module ${m.n} complete.`);
        location.hash = nx ? `#/m/${nx.id}/0` : '#/';
        break;
      }
      case 'locked': toast('This module arrives in the next update.'); break;
      case 'score': {
        const t = el.dataset.t, k = el.dataset.k, n = +el.dataset.n;
        S.scores = S.scores || {};
        S.scores[t] = S.scores[t] || {};
        S.scores[t][k] = S.scores[t][k] === n ? 0 : n;
        S.scoresDate = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
        save(); rerender();
        break;
      }
      case 'copyCap': { const t = capText(); t ? copyText(t) : toast('Fill in at least one box first.'); break; }
      case 'saveCap': { const t = capText(); t ? addToLibrary({ title: 'My assistant design' + ((S.capstone || {}).name ? `: ${S.capstone.name.trim()}` : ''), text: t, tags: ['capstone'] }) : toast('Fill in at least one box first.'); break; }
      case 'scoreClear':
        if (scoreClearArmed) { S.scores = {}; S.scoresDate = null; scoreClearArmed = false; save(); toast('Scores cleared.'); rerender(); }
        else { scoreClearArmed = true; rerender(); setTimeout(() => { if (scoreClearArmed) { scoreClearArmed = false; if (document.querySelector('.sc-results')) rerender(); } }, 4000); }
        break;
      case 'copyBuilt': { const t = builderPrompt(); t ? copyText(t) : toast('Add something to at least one box first.'); break; }
      case 'saveBuilt': { const t = builderPrompt(); t ? addToLibrary({ title: (S.builder.task || 'Built prompt').slice(0, 60), text: t, tags: ['builder'] }) : toast('Add something to at least one box first.'); break; }
      case 'exampleBuilt': S.builder = Object.assign({}, BUILDER_EXAMPLE); save(); rerender(); break;
      case 'clearBuilt': S.builder = { role: '', task: '', context: '', format: '', constraints: '' }; save(); rerender(); break;
      case 'pick': PICK[el.dataset.f] = el.dataset.f === 'sensitive' ? el.dataset.v === 'yes' : el.dataset.v; rerender(); break;
      case 'libNew': libEditing = 'new'; rerender(); setTimeout(() => { const i = $('.lib-form input'); i && i.focus(); }, 0); break;
      case 'libEdit': libEditing = el.dataset.id; route.keepScroll = false; route(); setTimeout(() => { const i = $('.lib-form input'); i && i.focus(); }, 0); break;
      case 'libCancel': libEditing = null; rerender(); break;
      case 'libDel': {
        const x = S.library.find(i => i.id === el.dataset.id);
        if (x && el.dataset.armed) { S.library = S.library.filter(i => i.id !== x.id); save(); toast('Prompt deleted.'); rerender(); }
        else { el.dataset.armed = '1'; el.innerHTML = ICON.trash + 'Press again to delete'; setTimeout(() => { if (el.isConnected) { delete el.dataset.armed; el.innerHTML = ICON.trash + 'Delete'; } }, 3000); }
        break;
      }
      case 'pref': S[el.dataset.f] = el.dataset.v; save(); applyPrefs(); rerender(); break;
      case 'export': exportBackup(); break;
      case 'copyBackup': copyText(backupJSON(), 'Backup copied. Paste it somewhere safe.'); break;
      case 'restoreText': {
        const box = $('#restore-text');
        if (!box || !box.value.trim()) { toast('Paste a backup into the box first.'); if (box) box.focus(); break; }
        if (restoreFrom(box.value)) rerender('[data-act="restoreText"]');
        break;
      }
      case 'reset':
        if (resetArmed) {
          const keep = { library: S.library, theme: S.theme, textSize: S.textSize, seenHero: true };
          S = Object.assign(defaults(), keep); save(true); resetArmed = false; toast('Progress cleared.'); rerender();
        } else { resetArmed = true; rerender(); setTimeout(() => { if (resetArmed) { resetArmed = false; if (location.hash.startsWith('#/settings')) rerender(); } }, 4000); }
        break;
    }
  });

  document.addEventListener('change', e => {
    const el = e.target;
    if (el.dataset.act === 'tick') {
      const id = el.dataset.id;
      S.checks[id] = S.checks[id] || [];
      S.checks[id][+el.dataset.i] = el.checked;
      save();
    } else if (el.dataset.act === 'import' && el.files && el.files[0]) {
      const r = new FileReader();
      r.onload = () => { if (restoreFrom(r.result)) rerender(); };
      r.onerror = () => toast('That file couldn’t be read. Try saving the backup again.');
      r.readAsText(el.files[0]);
      el.value = '';
    }
  });

  document.addEventListener('input', e => {
    const el = e.target, act = el.dataset.act;
    if (act === 'note') { S.notes[el.dataset.mod] = el.value; save(); }
    else if (act === 'cap') { S.capstone = S.capstone || {}; S.capstone[el.dataset.k] = el.value; save(); const o = $('#cap-out'); if (o) o.textContent = capText() || 'Start filling in the boxes above.'; }
    else if (act === 'build') { S.builder[el.dataset.k] = el.value; save(); $('#built-out').innerHTML = builtOut(); }
    else if (act === 'libSearch' || act === 'glSearch') {
      if (act === 'libSearch') libQuery = el.value; else glQuery = el.value;
      const pos = el.selectionStart; rerender();
      const n = $(`[data-act="${act}"]`); if (n) { n.focus(); n.setSelectionRange(pos, pos); }
    }
  });

  document.addEventListener('submit', e => {
    const f = e.target;
    if (f.dataset.act !== 'libSave') return;
    e.preventDefault();
    const fd = new FormData(f);
    const title = String(fd.get('title')).trim(), text = String(fd.get('text')).trim();
    const tags = String(fd.get('tags')).split(',').map(t => t.trim()).filter(Boolean);
    if (!title || !text) { toast('Add a title and a prompt.'); return; }
    if (libEditing === 'new') S.library.unshift({ id: uid(), title, text, tags, created: Date.now() });
    else { const x = S.library.find(i => i.id === libEditing); if (x) Object.assign(x, { title, text, tags }); }
    libEditing = null; save(); toast('Prompt saved.'); rerender();
  });

  document.addEventListener('keydown', e => {
    const tab = e.target.closest && e.target.closest('[role=tab]');
    if (tab && ['ArrowRight', 'ArrowLeft', 'Home', 'End'].includes(e.key)) {
      const tabs = $$('[role=tab]', tab.parentElement);
      let i = tabs.indexOf(tab);
      i = e.key === 'Home' ? 0 : e.key === 'End' ? tabs.length - 1 : (i + (e.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length;
      e.preventDefault(); tabs[i].focus(); tabs[i].click();
      return;
    }
    if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet();
    if (e.key === 'Tab' && !$('#sheet').hidden) { e.preventDefault(); $('#sheet-close').focus(); }
  });
  $('#sheet-close').addEventListener('click', closeSheet);
  $('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });

  function backupJSON() {
    return JSON.stringify({ app: 'aifluency', version: 1, saved: new Date().toISOString(), state: S });
  }
  function restoreFrom(text) {
    let data;
    try { data = JSON.parse(String(text).trim()); } catch (e) { data = null; }
    if (!data || data.app !== 'aifluency' || !data.state || typeof data.state !== 'object') {
      toast('That isn’t an AI Fluency backup. Check you copied all of it.');
      return false;
    }
    S = sanitize(data.state); save(true); applyPrefs();
    const n = Object.keys(S.done).length, l = S.library.length;
    toast(`Backup restored: ${n} module${n === 1 ? '' : 's'} complete, ${l} saved prompt${l === 1 ? '' : 's'}.`);
    return true;
  }
  function exportBackup() {
    const blob = new Blob([backupJSON()], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `ai-fluency-backup-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast('Backup file saved.');
  }

  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyPrefs);
  window.addEventListener('hashchange', route);
  window.addEventListener('pagehide', () => save(true));
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(true); });

  S = load();
  applyPrefs();
  route.focus = false;
  route();
})();

</script>
</body>
</html>
